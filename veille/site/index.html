<title>La FunVeille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  :root {
    /* Palette de marque */
    --bp: #361E1C;      /* Bordeaux profond */
    --bx: #733635;      /* Bordeaux */
    --coral: #FF6038;   /* Orange corail */
    --canard: #11363E;  /* Bleu canard */
    --aqua: #A0C9CB;    /* Aqua */
    --eau: #EBECDC;     /* Vert d'eau */
    --snow: #F6F5ED;    /* Snow */

    /* Rôles, thème clair */
    --ground: #F6F5ED;
    --panel: #EBECDC;
    --ink: #361E1C;
    --ink-2: #5A4644;
    --muted: #7A6A66;
    --line: #D5D5C3;
    --accent-ink: #733635;
    --link: #733635;

    --sans: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: "Instrument Serif", "Times New Roman", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #170D0C;
      --panel: #2A1715;
      --ink: #F6F5ED;
      --ink-2: #D6D4C6;
      --muted: #A89F96;
      --line: #44302D;
      --accent-ink: #FF6038;
      --link: #A0C9CB;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #170D0C;
    --panel: #2A1715;
    --ink: #F6F5ED;
    --ink-2: #D6D4C6;
    --muted: #A89F96;
    --line: #44302D;
    --accent-ink: #FF6038;
    --link: #A0C9CB;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    padding-inline: 16px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding-block: 24px 72px; display: grid; gap: 28px; }
  p, figure, blockquote { margin: 0; }
  h1, h2, h3, h4 { margin: 0; font-weight: inherit; text-wrap: balance; }
  a { color: var(--link); text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; border-radius: 3px; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

  .panel { border-radius: 22px; overflow: hidden; }
  p strong { font-weight: 600; color: var(--ink); }
  .market p strong, .impact p strong, .spirit p strong { color: var(--snow); }
  .legal p strong { color: var(--bp); }
  .legal .impact p strong { color: var(--aqua); }
  .label {
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    line-height: 1.5;
  }
  .caps { font-family: var(--serif); text-transform: uppercase; line-height: 0.95; letter-spacing: 0.005em; }

  /* Images : elles remplissent leur cadre */
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .scrim { position: absolute; inset: 0; pointer-events: none; }
  .img-note {
    position: absolute; left: 20px; bottom: 16px; z-index: 2;
    font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--snow); opacity: 0.85;
  }

  /* ---------- Hero ---------- */
  .hero { position: relative; display: grid; grid-template-columns: 1fr 1.1fr; min-height: 660px; margin-top: -28px; background: var(--bp); color: var(--snow); }
  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    height: 72px; margin-bottom: -72px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
    padding: 0 26px 0 30px; color: var(--snow);
    border-radius: 22px 22px 0 0;
    transition: background-color 0.2s ease, border-radius 0.2s ease;
  }
  .topbar.stuck { background: rgba(54, 30, 28, 0.95); border-radius: 0 0 18px 18px; box-shadow: 0 8px 24px rgba(23, 13, 12, 0.18); }
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    .topbar.stuck { background: rgba(54, 30, 28, 0.86); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  }
  @media (prefers-reduced-motion: reduce) { .topbar { transition: none; } }
  .topbar nav { display: flex; gap: 22px; }
  .topbar a { color: var(--snow); text-decoration: none; }
  .topbar a:hover { text-decoration: underline; }
  .topbar nav a { position: relative; opacity: 0.72; transition: opacity 0.2s ease; }
  .topbar nav a.on { opacity: 1; }
  .topbar nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 2px; border-radius: 2px; background: transparent; }
  .topbar nav a[data-scroll="inspiration"].on::after { background: #FF6038; }
  .topbar nav a[data-scroll="marche"].on::after { background: #6FB3BE; }
  .topbar nav a[data-scroll="legal"].on::after { background: #A0C9CB; }
  .topbar nav a.on:hover { text-decoration: none; }
  .issue-nav { justify-self: end; display: inline-flex; align-items: center; gap: 4px; }
  .issue-nav button {
    appearance: none; border: 0; background: transparent; color: var(--snow);
    width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  }
  .issue-nav button:hover:not(:disabled) { background: rgba(246, 245, 237, 0.16); }
  .issue-nav button:disabled { opacity: 0.3; cursor: default; }
  .issue-nav svg { width: 16px; height: 16px; }
  .issue-nav .current { min-width: 8.5em; text-align: center; }
  .hero-text { padding: 96px 32px 32px; display: grid; grid-template-rows: auto auto 1fr auto auto; gap: 24px; }
  .hero-meta { color: var(--eau); opacity: 0.85; }
  .hero-caps { font-size: clamp(36px, 4.4vw, 54px); color: var(--eau); }
  .hero-title {
    font-family: var(--sans); font-weight: 600;
    font-size: clamp(54px, 7.4vw, 88px); line-height: 0.9; letter-spacing: -0.05em;
    color: var(--snow);
  }
  .hero-title em { display: block; font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; color: var(--coral); }
  .hero-name { white-space: nowrap; }
  .issue-no { font-weight: 500; font-size: 0.36em; letter-spacing: -0.01em; color: var(--coral); vertical-align: top; position: relative; top: 0.14em; margin-left: 0.16em; white-space: nowrap; }
  .hero-dek { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.6; max-width: 38ch; color: var(--eau); }
  .hero-img { position: relative; min-height: 100%; background: var(--canard); }
  .hero-img .scrim { background: linear-gradient(180deg, rgba(23, 13, 12, 0.55) 0%, rgba(23, 13, 12, 0) 20%, rgba(23, 13, 12, 0) 66%, rgba(23, 13, 12, 0.62) 100%); }
  .cover-cap { position: absolute; right: 26px; bottom: 22px; z-index: 2; text-align: right; display: grid; gap: 4px; color: var(--snow); }
  .cover-cap a { color: var(--snow); font-size: 22px; font-weight: 500; letter-spacing: -0.01em; text-decoration-thickness: 1.5px; text-underline-offset: 5px; }

  @media (max-width: 820px) {
    .hero { grid-template-columns: 1fr; min-height: 0; }
    .topbar { height: 76px; margin-bottom: -76px; grid-template-columns: 1fr auto; grid-template-rows: auto auto; align-content: center; gap: 7px 10px; padding: 0 6px 0 18px; }
    .topbar.label { font-size: 10.5px; letter-spacing: 0.1em; }
    .topbar nav { grid-column: 1 / -1; grid-row: 2; flex-wrap: nowrap; white-space: nowrap; gap: 16px; }
    .topbar .ico { width: 1.2em; height: 1.2em; margin-right: 0.4em; }
    .issue-nav button { width: 26px; height: 26px; }
    .issue-nav svg { width: 13px; height: 13px; }
    .issue-nav .current { min-width: 0; }
    .hero-text { padding: 100px 20px 28px; gap: 20px; }
    .hero-img { min-height: 0; aspect-ratio: 4 / 5; }
  }

  .notice { font-size: 13.5px; color: var(--ink-2); max-width: 70ch; }
  .notice strong { color: var(--ink); font-weight: 600; }

  /* ---------- Chiffres clés ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpi { padding: 22px 22px 20px; min-height: 200px; display: grid; grid-template-rows: auto 1fr auto auto; gap: 10px; }
  .kpi-src { font-size: 11px; line-height: 1.4; letter-spacing: 0.02em; opacity: 0.72; border-top: 1px solid currentColor; border-top-color: rgba(127, 127, 127, 0.35); padding-top: 8px; margin-top: 2px; }
  .kpi-value { font-family: var(--sans); font-weight: 600; font-size: 46px; line-height: 1; letter-spacing: -0.03em; align-self: end; }
  .kpi-text { font-size: 14px; line-height: 1.45; }
  .k1 { background: var(--bp); color: var(--snow); }
  .k1 .kpi-value { color: var(--coral); }
  .k2 { background: var(--bx); color: var(--snow); }
  .k3 { background: var(--canard); color: var(--aqua); }
  .k4 { background: var(--aqua); color: var(--bp); }
  @media (max-width: 820px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi { min-height: 180px; padding: 18px; } .kpi-value { font-size: 38px; } }

  /* Blocs posés sur le fond de page : même retrait que le texte des panneaux */
  .edito, .weak, .registry, .outro, .notice, .colophon { padding-inline: clamp(6px, 3.4vw, 40px); }

  /* ---------- Édito ---------- */
  .edito { border-top: 1px solid var(--ink); padding-top: 22px; padding-bottom: 24px; display: grid; gap: 24px; }
  .edito-head { display: grid; gap: 18px; align-content: start; }
  .edito-head .label { color: var(--accent-ink); }
  .edito h2 { font-family: var(--serif); font-size: clamp(40px, 6vw, 76px); line-height: 0.98; }
  .edito-tension { font-family: var(--serif); font-style: italic; font-size: clamp(24px, 2.6vw, 31px); line-height: 1.15; color: var(--accent-ink); }
  .edito-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 44px; align-content: start; }
  .edito-body .sources { grid-column: 1 / -1; }
  .edito-body p { font-size: 17px; line-height: 1.65; color: var(--ink-2); }
  .edito-body .sources { margin-top: 4px; }
  .edito-body .sources a { color: var(--link); }
  @media (max-width: 820px) { .edito-body { grid-template-columns: 1fr; } }

  /* ---------- En-têtes de rubrique ---------- */
  section { display: grid; gap: 22px; scroll-margin-top: 96px; }
  @media (max-width: 820px) { section, .feature { scroll-margin-top: 92px !important; } }

  /* ---------- Ouvertures de chapitre ---------- */
  :root { --chap-inspiration: #FF6038; --chap-marche: #11363E; --chap-legal: #A0C9CB; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --chap-marche: #4E97A3; } }
  :root[data-theme="dark"] { --chap-marche: #4E97A3; }
  .chap { margin-top: 56px; border-top: 6px solid var(--chap); padding-top: 18px; padding-inline: clamp(6px, 3.4vw, 40px); display: grid; gap: 10px; }
  .chap-inspiration { --chap: var(--chap-inspiration); }
  .chap-marche { --chap: var(--chap-marche); }
  .chap-legal { --chap: var(--chap-legal); }
  .chap-top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
  .chap-num { font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1; color: var(--ink); }
  .chap-top .label { color: var(--accent-ink); }
  .chap h2 { font-size: clamp(34px, 5.6vw, 68px); line-height: 1; }
  @media (max-width: 720px) { .chap { margin-top: 36px; } }

  /* ---------- Inspiration : planche tendance ---------- */
  .trend { background: var(--panel); padding: 36px 36px 38px; display: grid; gap: 30px; }
  .trend-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px 40px; align-items: end; }
  .trend-head-text { display: grid; gap: 14px; }
  .tension { display: grid; gap: 4px; }
  .tension .label { color: var(--accent-ink); }
  .tension p { font-size: 16px; color: var(--ink); }
  .trend-deep { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 22px 44px; border-top: 1px solid var(--ink); padding-top: 22px; }
  .trend-deep .label { color: var(--accent-ink); }
  .insight-box { display: grid; gap: 10px; align-content: start; }
  .insight-box blockquote { font-family: var(--serif); font-style: italic; font-size: clamp(26px, 2.8vw, 34px); line-height: 1.1; color: var(--ink); }
  .insight-box .who { font-size: 12.5px; color: var(--muted); }
  .lecture { display: grid; gap: 10px; align-content: start; }
  .lecture p { font-size: 16px; line-height: 1.65; }
  @media (max-width: 820px) { .trend-deep { grid-template-columns: 1fr; } }
  .trend-name { font-family: var(--sans); font-weight: 600; font-size: clamp(60px, 8.4vw, 104px); line-height: 0.9; letter-spacing: -0.05em; overflow-wrap: anywhere; }
  .trend-name sup { font-weight: 400; font-size: 0.32em; color: var(--coral); vertical-align: top; position: relative; top: 0.1em; margin-left: 0.08em; }
  .trend-lede { font-family: var(--serif); font-size: 26px; line-height: 1.2; color: var(--ink); }
  .trend p { color: var(--ink-2); }
  .trend strong { color: var(--ink); font-weight: 600; }
  .quad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 26px 24px; }
  .q { display: grid; gap: 7px; align-content: start; border-top: 1px solid var(--ink); padding-top: 12px; }
  .q .label { color: var(--accent-ink); }
  .q-name { font-family: var(--serif); font-size: 27px; line-height: 1.05; color: var(--ink); }
  .q-img { position: relative; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; background: var(--line); margin-bottom: 4px; }
  .q-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .q-img .swatch { position: absolute; right: 10px; bottom: 10px; width: 34px; height: 34px; box-shadow: 0 0 0 2px var(--snow); }
  .q-credit { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .ico { display: inline-block; width: 1.3em; height: 1.3em; margin-right: 0.5em; vertical-align: -0.32em; flex: none; }
  .ico svg { display: block; width: 100%; height: 100%; }
  .brand { color: var(--snow); text-decoration: none; justify-self: start; }
  .brand:hover { text-decoration: underline; }
  .q p { font-size: 14.5px; line-height: 1.5; }
  .swatch-row { display: flex; align-items: center; gap: 12px; }
  .swatch { width: 46px; height: 46px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(23, 13, 12, 0.12); }
  .q-hex { display: block; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .q blockquote { font-family: var(--serif); font-style: italic; font-size: 34px; line-height: 1; color: var(--ink); }
  .q .who { font-size: 13px; line-height: 1.45; color: var(--ink-2); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12.5px; padding: 4px 11px; border: 1px solid var(--ink); border-radius: 999px; }
  .mini { display: grid; gap: 6px; }
  .mini .label { color: var(--accent-ink); }
  @media (max-width: 960px) { .quad { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 820px) { .trend { padding: 24px 22px 26px; } .trend-head { grid-template-columns: 1fr; } }
  @media (max-width: 520px) { .quad { grid-template-columns: 1fr; } }

  /* ---------- Inspiration : signaux ---------- */
  .feature { display: grid; grid-template-columns: 1.25fr 1fr; background: var(--panel); min-height: 540px; scroll-margin-top: 96px; }
  .feature.flip .fimg { order: 2; }
  .fimg { position: relative; min-height: 420px; background: var(--canard); }
  .fimg .scrim { background: linear-gradient(180deg, rgba(23, 13, 12, 0.58) 0%, rgba(23, 13, 12, 0) 34%, rgba(23, 13, 12, 0) 78%, rgba(23, 13, 12, 0.4) 100%); }
  .img-title { position: absolute; left: 28px; top: 24px; right: 28px; z-index: 2; display: grid; gap: 8px; color: var(--snow); }
  .img-title a { color: var(--snow); justify-self: start; font-size: clamp(30px, 3.6vw, 44px); font-weight: 500; line-height: 1.05; letter-spacing: -0.025em; text-decoration-thickness: 2px; text-underline-offset: 7px; }
  .ftext { padding: 30px 34px 32px; display: grid; gap: 14px; align-content: start; }
  .fmeta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 14px; }
  .kind { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--canard); color: var(--aqua); }
  .maturity { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--accent-ink); display: block; }
  .dots i.on { background: var(--accent-ink); }
  .kicker-rub { color: var(--accent-ink); display: inline-flex; align-items: center; gap: 8px; }
  .kicker-rub::before { content: ""; width: 9px; height: 9px; background: currentColor; display: inline-block; }
  .ftext h3 { font-family: var(--serif); font-size: clamp(30px, 3.2vw, 38px); line-height: 1.02; }
  .ftext p { font-size: 15.5px; line-height: 1.6; color: var(--ink-2); }
  .takeaway { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; }
  .takeaway .label { color: var(--accent-ink); }
  .takeaway p { color: var(--ink); }
  .src { font-size: 12px; color: var(--muted); }
  @media (max-width: 820px) {
    .feature { grid-template-columns: 1fr; min-height: 0; }
    .feature.flip .fimg { order: 0; }
    .fimg { min-height: 0; aspect-ratio: 4 / 3; }
    .ftext { padding: 22px 22px 26px; }
  }

  /* ---------- Signal faible ---------- */
  .weak { margin-top: 40px; border-top: 1px solid var(--ink); padding-top: 22px; padding-bottom: 32px; display: grid; gap: 20px; }
  .weak .label { color: var(--accent-ink); }
  .weak-bridge { font-family: var(--serif); font-style: italic; font-size: clamp(20px, 2.2vw, 24px); line-height: 1.3; color: var(--ink-2); max-width: 44em; }
  .weak-head { display: grid; gap: 14px; align-content: start; }
  .weak h3 { font-family: var(--sans); font-weight: 600; font-size: clamp(32px, 4vw, 48px); line-height: 1; letter-spacing: -0.035em; color: var(--ink); }
  .weak-where { font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .weak-why { font-family: var(--serif); font-style: italic; font-size: clamp(21px, 2.2vw, 26px); line-height: 1.2; color: var(--accent-ink); }
  .weak-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 44px; align-content: start; }
  .weak-side { display: grid; gap: 16px; align-content: start; }
  .weak-body .sources { grid-column: 1 / -1; }
  .weak-body p { font-size: 16px; line-height: 1.65; color: var(--ink-2); }
  .weak-ff { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; }
  .weak-ff p { color: var(--ink); }
  .weak .sources a { color: var(--link); }
  @media (max-width: 820px) { .weak-body { grid-template-columns: 1fr; } }

  /* ---------- Marché ---------- */
  .market { background: var(--canard); color: var(--snow); padding: 40px; display: grid; gap: 34px; }
  .market .label { color: var(--aqua); }
  .market-head { display: grid; gap: 16px; }
  .market h2 { font-family: var(--sans); font-weight: 600; font-size: clamp(40px, 5.6vw, 68px); line-height: 0.98; letter-spacing: -0.04em; }
  .kicker { font-family: var(--serif); font-size: clamp(24px, 2.6vw, 30px); line-height: 1.15; color: var(--aqua); max-width: 32em; }
  .market-lede { font-size: 16px; max-width: 62ch; opacity: 0.9; }
  .exhibit { border-top: 1px solid rgba(160, 201, 203, 0.35); padding-top: 22px; display: grid; gap: 18px; }
  .exhibit-title { font-family: var(--serif); font-size: 26px; line-height: 1.15; }
  .chain { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .stage { position: relative; border: 1px solid rgba(160, 201, 203, 0.35); border-radius: 14px; padding: 16px; display: grid; gap: 8px; align-content: start; }
  .stage.hot { background: var(--aqua); border-color: var(--aqua); color: var(--canard); }
  .stage.hot .label { color: var(--canard); }
  .stage-name { font-weight: 600; font-size: 15.5px; line-height: 1.3; }
  .stage-who { font-size: 14px; line-height: 1.45; color: var(--aqua); }
  .stage-fig { font-weight: 600; font-size: 36px; line-height: 1; letter-spacing: -0.03em; }
  .stage-fig small { display: block; font-weight: 400; font-size: 13.5px; letter-spacing: 0; margin-top: 6px; line-height: 1.35; }
  .bar-block { display: grid; gap: 8px; }
  .bar { display: flex; height: 24px; gap: 2px; }
  .bar div { height: 100%; background: var(--aqua); opacity: 0.55; }

  /* ---------- Note légale ---------- */

  .articles { display: grid; gap: 22px; align-content: start; }
  .article { display: grid; gap: 8px; }
  .article blockquote { font-family: var(--serif); font-style: italic; font-size: 24px; line-height: 1.25; }
  .article p { font-size: 15.5px; }
  .rules { display: grid; gap: 22px; align-content: start; }
  .rules h4 { font-size: 11.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 10px; }

  /* ---------- Registre ---------- */
  .registry { display: grid; gap: 14px; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 24px; }
  .registry summary { cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; list-style: none; }

  .reg-title { font-family: var(--serif); font-size: 24px; color: var(--ink); }
  .registry[open] { padding-bottom: 8px; }
  .registry .label { color: var(--accent-ink); }

  .reg-table th { font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

  .colophon { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 20px; border-top: 1px solid var(--ink); padding-top: 14px; color: var(--ink-2); }
  .colophon button { appearance: none; border: 0; background: none; padding: 0; color: var(--link); font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

    .hero { margin-top: -28px; }

    .edito-body p { font-size: 15.5px; }
    .trend { padding: 22px 20px 26px; gap: 22px; }
    .trend-name { font-size: 54px; }
    .trend-lede { font-size: 21px; }
    .insight-box blockquote { font-size: 24px; }
    /* Focus de tendance : carrousel horizontal */

    .quad::-webkit-scrollbar { display: none; }

    .weak-bridge { font-size: 19px; }

    .market h2 { font-size: 36px; }
    .kicker { font-size: 21px; }
    .chain { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .stage { padding: 12px; }
    .stage:not(:last-child)::after { display: none; }
    .stage-fig { font-size: 28px; }
    .findings { gap: 18px; }
    .finding-fig { font-size: 38px; }
    .sowhat, .impact { padding: 20px 18px; border-radius: 14px; }

  .state { min-height: 60vh; display: grid; place-items: center; text-align: center; color: var(--ink-2); padding: 40px 0; }
  .state strong { display: block; font-family: var(--serif); font-size: 34px; color: var(--ink); font-weight: 400; margin-bottom: 8px; }
</style>

<div class="wrap" id="app">
  <div class="state"><div><strong>La FunVeille</strong>Chargement du numéro…</div></div>
</div>

<script>
(function () {
  "use strict";

  var app = document.getElementById("app");
  var catalogue = [];
  var cache = {};
  var currentIndex = -1;

  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var rich = function (s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); };
  var url = function (u) { return /^(https?:)?\/\//.test(u) || /^[\w./-]+$/.test(u) ? esc(u) : "#"; };
  var pad = function (v) { var x = String(parseInt(v, 10) || 0); return x.length < 2 ? "0" + x : x; };
  var join = function (arr, fn) { return (arr || []).map(fn).join(""); };

  var ICONS = {
    inspiration: '<path d="M8 1.6 9.35 6.65 14.4 8 9.35 9.35 8 14.4 6.65 9.35 1.6 8 6.65 6.65Z"/>',
    marche: '<path d="M1.8 14h12.4"/><path d="M4.2 14V9.4M8 14V6.2M11.8 14V3" stroke-width="2.4" stroke-linecap="butt"/>',
    societe: '<circle cx="5.6" cy="5.2" r="2.2"/><circle cx="10.6" cy="5.8" r="1.8"/><path d="M1.8 13.6c.4-2.6 1.9-4.2 3.8-4.2s3.4 1.6 3.8 4.2M9.4 9.9c.4-.2.8-.3 1.2-.3 1.6 0 2.9 1.4 3.2 4"/>',
    signal: '<circle cx="8" cy="8" r="1.4"/><path d="M5.2 10.8a4 4 0 0 1 0-5.6M10.8 5.2a4 4 0 0 1 0 5.6M3.1 12.9a7 7 0 0 1 0-9.8M12.9 3.1a7 7 0 0 1 0 9.8"/>',
    legal: '<path d="M8 2.4v11.1M5 13.6h6M2.4 4.4h11.2"/><path d="M2.4 4.4 1 8.4M2.4 4.4l1.4 4M1 8.4c.2 1.2 2.6 1.2 2.8 0"/><path d="M13.6 4.4 12.2 8.4M13.6 4.4l1.4 4M12.2 8.4c.2 1.2 2.6 1.2 2.8 0"/>'
  };
  var ico = function (key) {
    var k = /l[ée]gal|juridi/i.test(key) ? "legal" : /march/i.test(key) ? "marche" : /inspi/i.test(key) ? "inspiration" : /soci|fil/i.test(key) ? "societe" : /signal/i.test(key) ? "signal" : null;
    if (!k) return "";
    return '<span class="ico" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">' + ICONS[k] + "</svg></span>";
  };

  var chevron = function (dir) {
    var d = dir === "prev" ? "M10 3 L5 8 L10 13" : "M6 3 L11 8 L6 13";
    return '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  };

  function sources(list) {
    if (!list || !list.length) return "";
    return '<div class="sources"><span class="label">Sources</span><ul>' +
      join(list, function (s) { return '<li><a href="' + url(s.url) + '" target="_blank" rel="noopener">' + esc(s.titre) + "</a></li>"; }) +
      "</ul></div>";
  }

  function topbar(n, hasPrev, hasNext) {
    return '<div class="topbar label" id="topbar">' +
        '<a href="#" class="brand" data-top="1" title="Revenir en haut">La FunVeille</a>' +
        '<nav aria-label="Rubriques"><a href="#" data-scroll="inspiration">' + ico("inspiration") + 'Inspiration</a><a href="#" data-scroll="marche">' + ico("marche") + 'Marché</a><a href="#" data-scroll="legal">' + ico("legal") + "Juridique</a></nav>" +
        '<div class="issue-nav">' +
          '<button type="button" data-go="-1" aria-label="Numéro précédent"' + (hasPrev ? "" : " disabled") + ">" + chevron("prev") + "</button>" +
          '<span class="current" aria-live="polite">Numéro ' + pad(n.numero) + "</span>" +
          '<button type="button" data-go="1" aria-label="Numéro suivant"' + (hasNext ? "" : " disabled") + ">" + chevron("next") + "</button>" +
        "</div>" +
      "</div>";
  }

  function hero(n) {
    var c = n.couverture || {};
    return '<header class="hero panel">' +
      '<div class="hero-text">' +
        '<span class="label hero-meta">Semaine ' + esc(n.semaine) + "<br>" + esc(n.date_label) + "</span>" +
        '<p class="caps hero-caps">Veille hebdomadaire<br>du funéraire</p>' +
        "<span></span>" +
        '<h1 class="hero-title"><em>La</em> <span class="hero-name">FunVeille<span class="issue-no">#' + pad(n.numero) + "</span></span></h1>" +
        '<p class="hero-dek">Ce qui bouge autour de la mort, du deuil et de la mémoire en Europe. Un édito, une tendance, des signaux, le marché, le droit. Chaque lundi, jamais deux fois la même chose.</p>' +
      "</div>" +
      '<figure class="hero-img">' +
        (c.image ? '<img class="photo" src="' + url(c.image) + '" alt="' + esc(c.alt) + '">' : "") +
        '<div class="scrim"></div>' +
        (c.credit ? '<span class="img-note">' + esc(c.credit) + "</span>" : "") +
        '<figcaption class="cover-cap"><span class="label">En couverture</span>' +
          '<a href="#" data-scroll="' + esc(c.ancre) + '">' + esc(c.titre) + " ↓</a></figcaption>" +
      "</figure>" +
    "</header>";
  }

  function kpis(list) {
    return '<div class="kpis panel" aria-label="L\'essentiel en quatre chiffres">' +
      join(list, function (k, i) {
        return '<div class="kpi k' + ((i % 4) + 1) + '"><span class="label">' + ico(k.rubrique) + esc(k.rubrique) + '</span><span class="kpi-value">' + esc(k.valeur) + '</span><span class="kpi-text">' + esc(k.texte) + "</span>" + (k.source ? '<span class="kpi-src">Source : ' + esc(k.source) + "</span>" : "") + "</div>";
      }) + "</div>";
  }

  function filRouge(f) {
    if (!f) return "";
    return '<section id="edito"><div class="edito">' +
      '<div class="edito-head"><span class="label">' + ico("societe") + "L'édito de la semaine</span><h2>" + esc(f.titre) + "</h2>" +
        (f.tension ? '<p class="edito-tension">' + esc(f.tension) + "</p>" : "") + "</div>" +
      '<div class="edito-body">' + join(f.texte, function (t) { return "<p>" + rich(t) + "</p>"; }) + sources(f.sources) + "</div>" +
    "</div></section>";
  }

  function signalFaible(w) {
    if (!w) return "";
    return '<section id="signal-faible"><div class="weak">' +
      (w.lien ? '<p class="weak-bridge">' + esc(w.lien) + "</p>" : "") +
      '<div class="weak-head"><span class="label">' + ico("signal") + "Signal faible</span><h3>" + esc(w.titre) + "</h3>" +
        (w.lieu ? '<span class="weak-where">' + esc(w.lieu) + "</span>" : "") + "</div>" +
      '<div class="weak-body"><p>' + rich(w.texte) + "</p>" +
        '<div class="weak-side">' + (w.pourquoi ? '<p class="weak-why">' + esc(w.pourquoi) + "</p>" : "") +
        (w.pour_funfun ? '<div class="weak-ff"><span class="label">Pour FunFun</span><p>' + rich(w.pour_funfun) + "</p></div>" : "") + "</div>" +
        sources(w.sources) + "</div>" +
    "</div></section>";
  }

  function noteSpirituelle(s) {
    if (!s) return "";
    return '<section id="pour-finir" aria-label="Pour finir"><div class="spirit panel">' +
      '<span class="label">Pour finir</span>' +
      "<blockquote>" + esc(s.citation) + " »</blockquote>" +
      '<div class="spirit-who"><strong>' + esc(s.auteur) + "</strong>" + (s.contexte ? "<span>" + esc(s.contexte) + "</span>" : "") +
        (s.source && s.source.url ? '<a href="' + url(s.source.url) + '" target="_blank" rel="noopener">' + esc(s.source.titre || "Source") + "</a>" : "") + "</div>" +
      (s.reflexion ? '<p class="spirit-reflex">' + rich(s.reflexion) + "</p>" : "") +
    "</div></section>";
  }

  function chapter(key, num, name, title) {
    return '<div class="chap chap-' + key + '"><div class="chap-top"><span class="chap-num">Chapitre ' + num + '</span><span class="label">' + ico(key) + name + "</span></div>" +
      '<h2 class="caps">' + title + "</h2></div>";
  }

  function dots(n) {
    var out = "";
    for (var i = 1; i <= 3; i++) out += "<i" + (i <= n ? ' class="on"' : "") + "></i>";
    return out;
  }
  var maturityLabel = ["", "Émergent", "En diffusion", "Installé"];

  function inspiration(ins) {
    var t = ins.tendance || {};
    var qimg = function (o, extra) {
      var im = (o && o.image) || {};
      if (!im.src) return "";
      return '<div class="q-img"><img src="' + url(im.src) + '" alt="' + esc(im.alt) + '" loading="lazy">' + (extra || "") + "</div>";
    };
    var qcredit = function (o) { return o && o.image && o.image.credit ? '<span class="q-credit">' + esc(o.image.credit) + "</span>" : ""; };
    var q = function (label, o, inner, extra) { return '<div class="q">' + qimg(o, extra) + '<span class="label">' + label + "</span>" + inner + qcredit(o) + "</div>"; };
    var quad = "";
    if (t.couleur) {
      var hex = String(t.couleur.hex || "").replace("#", "");
      var dot = '<span class="swatch" style="background:#' + esc(hex) + '"></span>';
      quad += q("Une couleur", t.couleur, '<div class="swatch-row">' + (t.couleur.image ? "" : dot) + '<span><span class="q-name">' + esc(t.couleur.nom) + '</span><span class="q-hex">HEX : ' + esc(hex) + "</span></span></div><p>" + esc(t.couleur.texte) + "</p>", dot);
    }
    if (t.matiere) quad += q("Une matière", t.matiere, '<span class="q-name">' + esc(t.matiere.nom) + "</span><p>" + esc(t.matiere.texte) + "</p>");
    if (t.forme) quad += q("Une forme", t.forme, '<span class="q-name">' + esc(t.forme.nom) + "</span><p>" + esc(t.forme.texte) + "</p>");
    if (t.citation) quad += q("Une citation", t.citation, "<blockquote>« " + esc(t.citation.texte) + " »</blockquote>" + '<span class="who">' + esc(t.citation.auteur) + "</span>");
    var signals = join(ins.signaux, function (s, i) {
      var img = s.image || {};
      return '<article class="feature panel' + (i % 2 ? " flip" : "") + '" id="' + esc(s.id) + '">' +
        '<figure class="fimg">' +
          (img.src ? '<img class="photo" src="' + url(img.src) + '" alt="' + esc(img.alt) + '" loading="lazy">' : "") +
          '<div class="scrim"></div>' +
          '<div class="img-title"><a href="' + url(s.url) + '" target="_blank" rel="noopener">' + esc(s.nom) + ' ↗</a><span class="label">' + esc(s.lieu) + "</span></div>" +
          (img.credit ? '<span class="img-note">' + esc(img.credit) + "</span>" : "") +
        "</figure>" +
        '<div class="ftext">' +
          '<div class="fmeta"><span class="kind">' + esc(s.type) + '</span><span class="maturity">' + esc(maturityLabel[s.maturite] || "") + ' <span class="dots" aria-hidden="true">' + dots(s.maturite) + "</span></span></div>" +
          (s.rubrique ? '<span class="label kicker-rub">' + esc(s.rubrique) + "</span>" : "") +
          "<h3>" + esc(s.titre) + "</h3>" +
          "<p>" + rich(s.texte) + "</p>" +
          '<div class="takeaway"><span class="label">Pour FunFun</span><p>' + rich(s.pour_funfun) + "</p></div>" +
          (s.sources ? '<span class="src">Sources : ' + esc(s.sources) + "</span>" : "") +
        "</div>" +
      "</article>";
    });
    return '<section id="inspiration">' +
      chapter("inspiration", "01", "Inspiration · produits et services", "Tendance de la semaine") +
      '<div class="trend panel">' +
        '<div class="trend-head">' +
          '<div class="trend-name">' + esc(t.nom) + "<sup>✳</sup></div>" +
          '<div class="trend-head-text">' +
            '<p class="trend-lede">' + esc(t.accroche) + "</p>" +
            (t.tension ? '<div class="tension"><span class="label">La tension</span><p>' + esc(t.tension) + "</p></div>" : "") +
          "</div>" +
        "</div>" +
        ((t.insight || t.lecture) ? '<div class="trend-deep">' +
          (t.insight ? '<div class="insight-box"><span class="label">L\'insight</span><blockquote>« ' + esc(t.insight) + ' »</blockquote><span class="who">Formulé par la rédaction, à partir des signaux de la semaine.</span></div>' : "") +
          (t.lecture ? '<div class="lecture"><span class="label">Ce que ça dit de nous</span>' + join([].concat(t.lecture), function (x) { return "<p>" + rich(x) + "</p>"; }) + "</div>" : "") +
        "</div>" : "") +
        (quad ? '<div class="quad">' + quad + "</div>" : "") +
        (t.mots_cles ? '<div class="mini"><span class="label">Mots-clés</span><div class="tags">' + join(t.mots_cles, function (m) { return '<span class="tag">' + esc(m) + "</span>"; }) + "</div></div>" : "") +
      "</div>" +
      signals +
    "</section>" +
      signalFaible(ins.signal_faible);
  }

  function figure(f) {
    if (!f) return "";
    var chain = f.chaine ? '<div class="chain">' + join(f.chaine, function (e) {
      return '<div class="stage' + (e.cle ? " hot" : "") + '"><span class="label">' + esc(e.etiquette) + '</span><span class="stage-name">' + esc(e.nom) + "</span>" +
        (e.chiffre ? '<span class="stage-fig">' + esc(e.chiffre) + "<small>" + esc(e.legende) + "</small></span>" : "") +
        (e.texte ? '<span class="stage-who">' + esc(e.texte) + "</span>" : "") + "</div>";
    }) + "</div>" : "";
    var stacked = f.empile ? '<div class="bar-block"><span class="label">' + esc(f.empile.titre) + "</span>" +
      '<div class="bar" role="img" aria-label="' + esc(f.empile.segments.map(function (s) { return s.label; }).join(", ")) + '">' +
        join(f.empile.segments, function (s) { return '<div class="' + (s.accent ? "accent" : "") + '" style="width:' + Number(s.part) + '%"></div>'; }) +
      "</div>" +
      '<div class="bar-legend">' + join(f.empile.segments, function (s) { return "<span><i" + (s.accent ? ' class="accent"' : "") + "></i>" + esc(s.label) + "</span>"; }) + "</div></div>" : "";
    var bars = "";
    if (f.barres) {
      var max = Math.max.apply(null, f.barres.items.map(function (b) { return Number(b.valeur) || 0; })) || 1;
      bars = '<div class="bar-block">' + (f.barres.titre ? '<span class="label">' + esc(f.barres.titre) + "</span>" : "") + '<div class="hbars">' +
        join(f.barres.items, function (b) {
          return '<div class="hbar"><span>' + esc(b.label) + '</span><div class="hbar-track"><div class="hbar-fill' + (b.accent ? " accent" : "") + '" style="width:' + (100 * (Number(b.valeur) || 0) / max) + '%"></div></div><span class="hbar-val">' + esc(b.affiche || b.valeur) + "</span></div>";
        }) + "</div></div>";
    }
    return '<figure class="exhibit"><span class="label">Figure 1</span><span class="exhibit-title">' + esc(f.titre) + "</span>" + chain + stacked + bars +
      (f.note ? '<figcaption class="exhibit-foot">' + esc(f.note) + "</figcaption>" : "") + "</figure>";
  }

  function marche(m) {
    return '<section id="marche">' + chapter("marche", "02", "Marché", "Le marché, chiffres en main") +
      '<div class="market panel">' +
      '<div class="market-head"><span class="label">' + esc(m.zone || "Europe") + "</span><h2>" + esc(m.titre) + '</h2><p class="kicker">' + esc(m.accroche) + '</p><p class="market-lede">' + rich(m.chapo) + "</p></div>" +
      figure(m.figure) +
      '<div class="findings">' + join(m.constats, function (c) {
        return '<div class="finding"><span class="finding-fig">' + esc(c.chiffre) + "</span><h3>" + esc(c.titre) + "</h3><p>" + rich(c.texte) + "</p></div>";
      }) + "</div>" +
      '<div class="sowhat"><h3>Ce que ça veut dire pour FunFun</h3><ul>' + join(m.implications, function (x) {
        return "<li><span><strong>" + esc(x.gras) + "</strong>" + esc(x.texte) + "</span></li>";
      }) + "</ul></div>" +
      (m.lecture ? '<div class="soc-read"><span class="label">' + ico("societe") + "Ce que les chiffres disent de nous</span><p>" + rich(m.lecture) + "</p></div>" : "") +
      (m.a_suivre ? '<p class="watch"><strong>À suivre.</strong> ' + esc(m.a_suivre) + "</p>" : "") +
      sources(m.sources) +
    "</div></section>";
  }

  function legal(l) {
    var glyph = { non: "×", oui: "✓", info: "•" };
    return '<section id="legal">' + chapter("legal", "03", "Juridique", "La note juridique") +
      '<div class="legal panel">' +
      '<span class="label">' + esc(l.pays) + "</span>" +
      "<h2>" + esc(l.titre) + "</h2>" +
      '<div class="legal-grid"><div class="articles">' + join(l.articles, function (a) {
        return '<div class="article"><span class="label">' + esc(a.ref) + "</span>" +
          (a.citation ? "<blockquote>« " + esc(a.citation) + " »</blockquote>" : "") +
          (a.texte ? "<p>" + rich(a.texte) + "</p>" : "") + "</div>";
      }) + "</div>" +
      '<div class="rules">' + join(l.listes, function (li) {
        return '<div class="' + esc(li.type) + '"><h4>' + esc(li.titre) + "</h4><ul>" + join(li.items, function (it) {
          return '<li><b aria-hidden="true">' + (glyph[li.type] || "•") + "</b><span>" + esc(it) + "</span></li>";
        }) + "</ul></div>";
      }) + "</div></div>" +
      '<div class="impact"><h3>Ce que ça change pour FunFun</h3><p>' + rich(l.impact) + "</p></div>" +
      '<p class="disclaimer">Note de veille, pas un avis juridique. À faire valider par un juriste avant toute communication commerciale.</p>' +
      sources(l.sources) +
    "</div></section>";
  }

  function registry(n) {
    return '<details class="registry"><summary><span class="label">Coulisses</span><span class="reg-title">Registre anti-répétition</span></summary>' +
      "<p>Chaque numéro inscrit ses sujets dans un registre que la routine relit avant d'écrire le suivant. Un acteur, un chiffre ou un texte déjà traité ne revient que s'il y a un fait nouveau, signalé comme « mise à jour ».</p>" +
      '<div class="reg-table"><table><thead><tr><th>Rubrique</th><th>Entrées ajoutées dans ce numéro</th></tr></thead><tbody>' +
      join(n.registre, function (r) { return "<tr><td>" + esc(r.rubrique) + "</td><td>" + esc(r.entrees) + "</td></tr>"; }) +
      "</tbody></table></div></details>";
  }

  function render(n) {
    var hasPrev = currentIndex > 0;
    var hasNext = currentIndex < catalogue.length - 1;
    document.title = "La FunVeille";
    app.innerHTML =
      topbar(n, hasPrev, hasNext) +
      hero(n) +
      (n.maquette ? '<p class="notice"><strong>Maquette de la routine.</strong> Les informations sont réelles et sourcées. Les visuels sont des illustrations de maquette : dans la version finale, ce sont les photos récupérées sur les sources.</p>' : "") +
      kpis(n.chiffres) +
      filRouge(n.fil_rouge) +
      (n.inspiration ? inspiration(n.inspiration) : "") +
      (n.marche ? marche(n.marche) : "") +
      (n.legal ? legal(n.legal) : "") +
      registry(n) +
      noteSpirituelle(n.note_spirituelle) +
      (n.mot_de_la_fin ? '<p class="outro">' + esc(n.mot_de_la_fin) + "</p>" : "") +
      '<footer class="colophon"><span class="label">La FunVeille #' + pad(n.numero) + " · FunFun · " + catalogue.length + (catalogue.length > 1 ? " numéros" : " numéro") + "</span>" +
        '<span class="label"><button type="button" data-go="-1"' + (hasPrev ? "" : " disabled") + ">Numéro précédent</button> · " +
        '<button type="button" data-go="1"' + (hasNext ? "" : " disabled") + ">Numéro suivant</button></span></footer>";
  }

  function showError(msg) {
    app.innerHTML = '<div class="state"><div><strong>La FunVeille</strong>' + esc(msg) + "</div></div>";
  }

  function load(index, scrollTop) {
    var entry = catalogue[index];
    if (!entry) return;
    var done = function (n) {
      currentIndex = index;
      render(n);
      if (scrollTop) window.scrollTo(0, 0);
      syncBar();
    };
    if (cache[entry.fichier]) return done(cache[entry.fichier]);
    fetch(entry.fichier).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (n) {
      cache[entry.fichier] = n;
      done(n);
    }).catch(function () { showError("Ce numéro n'a pas pu être chargé. Rechargez la page."); });
  }

  function indexFromHash() {
    var m = /^#n(\d+)$/.exec(location.hash || "");
    if (!m) return catalogue.length - 1;
    var num = Number(m[1]);
    for (var i = 0; i < catalogue.length; i++) if (catalogue[i].numero === num) return i;
    return catalogue.length - 1;
  }

  function go(step) {
    var target = currentIndex + step;
    if (target < 0 || target >= catalogue.length) return;
    var num = catalogue[target].numero;
    if (location.hash !== "#n" + num) location.hash = "n" + num;
    else load(target, true);
  }

  app.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-go]");
    if (btn && !btn.disabled) { go(Number(btn.getAttribute("data-go"))); return; }
    if (e.target.closest("[data-top]")) { e.preventDefault(); window.scrollTo({ top: 0 }); return; }
    var link = e.target.closest("[data-scroll]");
    if (link) {
      e.preventDefault();
      var el = document.getElementById(link.getAttribute("data-scroll"));
      if (el) el.scrollIntoView();
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (/input|textarea|select/i.test((e.target && e.target.tagName) || "")) return;
    if (e.key === "ArrowLeft") go(-1);
    if (e.key === "ArrowRight") go(1);
  });

  var syncBar = function () {
    var bar = document.getElementById("topbar");
    if (!bar) return;
    bar.classList.toggle("stuck", window.scrollY > 16);
    var line = window.innerHeight * 0.35, active = null;
    ["inspiration", "marche", "legal"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el && el.getBoundingClientRect().top <= line && el.getBoundingClientRect().bottom > line) active = id;
    });
    bar.querySelectorAll("nav a").forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-scroll") === active); });
  };
  window.addEventListener("scroll", syncBar, { passive: true });

  window.addEventListener("hashchange", function () {
    if (/^#n\d+$/.test(location.hash)) load(indexFromHash(), true);
  });

  fetch("numeros/index.json").then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function (data) {
    catalogue = (data.numeros || []).slice().sort(function (a, b) { return a.numero - b.numero; });
    if (!catalogue.length) return showError("Aucun numéro publié pour l'instant.");
    load(indexFromHash(), false);
  }).catch(function () { showError("La liste des numéros n'a pas pu être chargée. Rechargez la page."); });
})();
</script>
