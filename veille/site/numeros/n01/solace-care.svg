    <filter id="spray" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="speckle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.21  0 0 0 0 0.12  0 0 0 0 0.11  0 0 0 -2.4 1.4" result="dots"/>
      <feComposite in="dots" in2="SourceGraphic" operator="in" result="d"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="d"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0.10 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <path id="urnBody" d="M-28 -196 L28 -196 L32 -176 C76 -162 90 -126 88 -92 C86 -48 62 -20 40 -6 L-40 -6 C-62 -20 -86 -48 -88 -92 C-90 -126 -76 -162 -32 -176 Z"/>
    <clipPath id="urnClip"><use href="#urnBody" xlink:href="#urnBody" transform="translate(400 540) scale(1.45)"/></clipPath>

