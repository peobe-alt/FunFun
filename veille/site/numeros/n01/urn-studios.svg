<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 700" width="800" height="700" preserveAspectRatio="xMidYMid slice"><defs>
    <linearGradient id="foldCanard" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="80" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#0B2A31"/><stop offset="0.5" stop-color="#1B4A54"/><stop offset="1" stop-color="#0B2A31"/>
    </linearGradient>
    <linearGradient id="foldEau" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="90" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#CFCDB9"/><stop offset="0.5" stop-color="#E8E7D6"/><stop offset="1" stop-color="#CFCDB9"/>
    </linearGradient>
    <linearGradient id="foldBx" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="84" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#5A2826"/><stop offset="0.5" stop-color="#8A4442"/><stop offset="1" stop-color="#5A2826"/>
    </linearGradient>
    <linearGradient id="floorCanard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2F35"/><stop offset="1" stop-color="#071C20"/></linearGradient>
    <linearGradient id="floorEau" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D4D2BE"/><stop offset="1" stop-color="#BDB9A2"/></linearGradient>
    <linearGradient id="floorBx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5C2927"/><stop offset="1" stop-color="#3E1B1A"/></linearGradient>
    <linearGradient id="floorWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D2D3C3"/><stop offset="1" stop-color="#BFC0AE"/></linearGradient>
    <radialGradient id="sideLight" cx="0.2" cy="0.1" r="0.9"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF8A66" stop-opacity="0.55"/><stop offset="0.55" stop-color="#FF6038" stop-opacity="0.14"/><stop offset="1" stop-color="#FF6038" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowCore" cx="0.5" cy="0.62" r="0.62"><stop offset="0" stop-color="#FFF7EC"/><stop offset="0.38" stop-color="#FFC7AE"/><stop offset="0.8" stop-color="#FF6038"/><stop offset="1" stop-color="#B8402A"/></radialGradient>
    <linearGradient id="aquaGlaze" x1="0" x2="1"><stop offset="0" stop-color="#CFE5E6"/><stop offset="0.45" stop-color="#A0C9CB"/><stop offset="1" stop-color="#6B989C"/></linearGradient>
    <linearGradient id="plinth" x1="0" x2="1"><stop offset="0" stop-color="#FBFAF4"/><stop offset="0.7" stop-color="#EDEBDF"/><stop offset="1" stop-color="#D9D6C6"/></linearGradient>
    <linearGradient id="bpBody" x1="0" x2="1"><stop offset="0" stop-color="#4A2A27"/><stop offset="0.5" stop-color="#361E1C"/><stop offset="1" stop-color="#1F1110"/></linearGradient>
    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="spray" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="speckle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.21  0 0 0 0 0.12  0 0 0 0 0.11  0 0 0 -2.4 1.4" result="dots"/>
      <feComposite in="dots" in2="SourceGraphic" operator="in" result="d"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="d"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0.10 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <path id="urnBody" d="M-28 -196 L28 -196 L32 -176 C76 -162 90 -126 88 -92 C86 -48 62 -20 40 -6 L-40 -6 C-62 -20 -86 -48 -88 -92 C-90 -126 -76 -162 -32 -176 Z"/>
    <clipPath id="urnClip"><use href="#urnBody" xlink:href="#urnBody" transform="translate(400 540) scale(1.45)"/></clipPath>

    </defs>
      <rect width="800" height="700" fill="#E1DFCD"/>
      <rect width="800" height="500" fill="url(#foldEau)"/>
      <rect y="500" width="800" height="200" fill="url(#floorEau)"/>
      <ellipse cx="400" cy="604" rx="190" ry="16" fill="#6F6A55" opacity="0.45" filter="url(#blur14)"/>
      <rect x="240" y="440" width="320" height="162" fill="url(#plinth)"/>
      <rect x="240" y="440" width="320" height="6" fill="#FFFFFF" opacity="0.7"/>
      <ellipse cx="392" cy="442" rx="84" ry="7" fill="#8C8773" opacity="0.5" filter="url(#blur6)"/>
      <g filter="url(#speckle)">
        <use href="#urnBody" xlink:href="#urnBody" transform="translate(392 444) scale(1.1)" fill="url(#aquaGlaze)"/>
        <path d="M-34 -196 C-34 -214 34 -214 34 -196 Z" transform="translate(392 444) scale(1.1)" fill="#7FAAAE"/>
      </g>
      <circle cx="392" cy="202" r="8" fill="#6B989C"/>
      <path d="M340 272 C352 258 368 252 384 250" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>
      <ellipse cx="500" cy="440" rx="40" ry="9" fill="#5A2826"/>
      <path d="M460 436 C466 452 534 452 540 436" fill="#733635"/>
      <ellipse cx="500" cy="436" rx="36" ry="6.5" fill="#8A4442"/>
      <circle cx="492" cy="434" r="7" fill="none" stroke="#D6A548" stroke-width="2.6"/>
      <rect width="800" height="700" fill="url(#sideLight)"/>
      <rect width="800" height="700" filter="url(#grain)" fill="#000"/>
    </svg>
