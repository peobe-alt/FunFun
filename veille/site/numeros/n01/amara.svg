<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="140 170 520 520" width="800" height="800" preserveAspectRatio="xMidYMid slice"><defs>
    <linearGradient id="foldCanard" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="80" y2="0" spreadMethod="repeat">
